<!DOCTYPE html>
<html>
<head>
    <title>Simple Quiz App</title>
    <link rel="stylesheet" href="Quizstyle.css">
</head>
<body>

    <div class="quiz">
        <h1>Simple Quiz</h1>

        <p id="question"></p>

        <button onclick="checkAnswer(0)" id="option0"></button>
        <button onclick="checkAnswer(1)" id="option1"></button>
        <button onclick="checkAnswer(2)" id="option2"></button>

        <p id="result"></p>
        <p id="score">Score: 0</p>

        <button onclick="restartQuiz()" id="restart">
            Restart Quiz
        </button>
    </div>

    <script src="Quizjs.js"></script>
</body>
</html>
